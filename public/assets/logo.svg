<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Text arc: Upper semicircle for "GEARS AND SPARES" -->
    <path id="textArc" d="M 230,810 A 408,408 0 1,1 850,810" fill="none" />
  </defs>

  <!-- 1. Background Circular Disk (Crimson / Deep Dark Red) -->
  <circle cx="540" cy="540" r="526" fill="#780000" />
  <circle cx="540" cy="540" r="522" fill="none" stroke="#680000" stroke-width="2" />

  <!-- 2. Curved Brand Text: GEARS AND SPARES -->
  <text fill="#ffffff" font-family="'Chivo', 'Montserrat', 'Arial Black', sans-serif" font-size="126" font-weight="900" letter-spacing="15">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      GEARS AND SPARES
    </textPath>
  </text>

  <!-- 3. Cogwheel Body (White) -->
  <path d="M 515.8 261.0 L 564.2 261.0 L 572.7 306.3 L 599.2 311.5 L 624.4 273.0 L 669.1 291.5 L 659.7 336.6 L 682.1 351.6 L 720.2 325.7 L 754.3 359.8 L 728.4 397.9 L 743.4 420.3 L 788.5 410.9 L 807.0 455.6 L 768.5 480.8 L 773.7 507.3 L 819.0 515.8 L 819.0 564.2 L 773.7 572.7 L 768.5 599.2 L 807.0 624.4 L 788.5 669.1 L 743.4 659.7 L 728.4 682.1 L 754.3 720.2 L 720.2 754.3 L 682.1 728.4 L 659.7 743.4 L 669.1 788.5 L 624.4 807.0 L 599.2 768.5 L 572.7 773.7 L 564.2 819.0 L 515.8 819.0 L 507.3 773.7 L 480.8 768.5 L 455.6 807.0 L 410.9 788.5 L 420.3 743.4 L 397.9 728.4 L 359.8 754.3 L 325.7 720.2 L 351.6 682.1 L 336.6 659.7 L 291.5 669.1 L 273.0 624.4 L 311.5 599.2 L 306.3 572.7 L 261.0 564.2 L 261.0 515.8 L 306.3 507.3 L 311.5 480.8 L 273.0 455.6 L 291.5 410.9 L 336.6 420.3 L 351.6 397.9 L 325.7 359.8 L 359.8 325.7 L 397.9 351.6 L 420.3 336.6 L 410.9 291.5 L 455.6 273.0 L 480.8 311.5 L 507.3 306.3 Z" fill="#ffffff" />

  <!-- 4. Inner Dark Maroon Cutout of the Cogwheel -->
  <circle cx="540" cy="540" r="185" fill="#780000" />

  <!-- 5. Crossed Tools in Center -->
  <!-- Wrench: Angled -45 deg (top-left to bottom-right) -->
  <g transform="translate(540, 540) rotate(-45)">
    <!-- Wrench Body -->
    <path d="
      M -15,-105
      L -15,105
      L 15,105
      L 15,-105
      Z
    " fill="#ffffff" />
    
    <!-- Top-Left Open Wrench Jaw -->
    <path d="
      M -38,-92
      C -42,-115 -25,-146 0,-152
      C 25,-146 42,-115 38,-92
      L 24,-92
      L 14,-112
      L -14,-112
      L -24,-92
      Z
    " fill="#ffffff" />
    <!-- Jaw cutout (U-shape) -->
    <path d="
      M -14,-90
      L -10,-120
      C -6,-126 6,-126 10,-120
      L 14,-90
      Z
    " fill="#780000" />

    <!-- Bottom-Right Open Wrench Jaw -->
    <path d="
      M -38,92
      C -42,115 -25,146 0,152
      C 25,146 42,115 38,92
      L 24,92
      L 14,112
      L -14,112
      L -24,92
      Z
    " fill="#ffffff" />
    <!-- Jaw cutout (U-shape) -->
    <path d="
      M -14,90
      L -10,120
      C -6,126 6,126 10,120
      L 14,90
      Z
    " fill="#780000" />
  </g>

  <!-- Screwdriver: Angled 45 deg (bottom-left to top-right) -->
  <g transform="translate(540, 540) rotate(45)">
    <!-- Screwdriver Shaft and Tip (top half in local frame) -->
    <rect x="-8" y="-142" width="16" height="105" fill="#ffffff" rx="2" />
    <!-- Keystone flat tip -->
    <polygon points="-8,-142 -12,-158 12,-158 8,-142" fill="#ffffff" />
    <!-- Ferrule / Bolster ring -->
    <rect x="-14" y="-38" width="28" height="12" fill="#ffffff" rx="3" />

    <!-- Screwdriver Handle (bottom half in local frame) -->
    <path d="
      M -20,-26
      C -22,0 -25,25 -25,65
      C -25,100 -20,125 -14,135
      C -8,144 8,144 14,135
      C 20,125 25,100 25,65
      C 25,25 22,0 20,-26
      Z
    " fill="#ffffff" />

    <!-- Recessed Grip Grooves (Maroon Stripes) -->
    <rect x="-24" y="24" width="48" height="12" rx="4" fill="#780000" />
    <rect x="-23" y="52" width="46" height="12" rx="4" fill="#780000" />
  </g>

  <!-- 6. Lotus Flower Emblem at Bottom Center -->
  <g transform="translate(540, 895) scale(1.05)">
    <!-- Central Upright Petal -->
    <path d="
      M 0,-48
      C 24,-24 22,14 0,28
      C -22,14 -24,-24 0,-48
      Z
    " fill="#fbd1c1" stroke="#08182b" stroke-width="9" stroke-linejoin="round" />

    <!-- Left Side Petal -->
    <path d="
      M -8,18
      C -28,8 -54,-10 -58,-32
      C -42,-34 -20,-10 0,-20
      Z
    " fill="#fbd1c1" stroke="#08182b" stroke-width="9" stroke-linejoin="round" />

    <!-- Right Side Petal -->
    <path d="
      M 8,18
      C 28,8 54,-10 58,-32
      C 42,-34 20,-10 0,-20
      Z
    " fill="#fbd1c1" stroke="#08182b" stroke-width="9" stroke-linejoin="round" />

    <!-- Bottom Left Wing Petal -->
    <path d="
      M -4,24
      C -30,22 -68,14 -94,-2
      C -76,-16 -40,-4 -12,12
      Z
    " fill="#fbd1c1" stroke="#08182b" stroke-width="9" stroke-linejoin="round" />

    <!-- Bottom Right Wing Petal -->
    <path d="
      M 4,24
      C 30,22 68,14 94,-2
      C 76,-16 40,-4 12,12
      Z
    " fill="#fbd1c1" stroke="#08182b" stroke-width="9" stroke-linejoin="round" />

    <!-- Lotus Base Calyx Anchor -->
    <path d="
      M -20,24
      C -6,34 6,34 20,24
      C 10,28 -10,28 -20,24
      Z
    " fill="#08182b" />
  </g>
</svg>